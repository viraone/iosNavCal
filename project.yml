name: NavCal
options:
  bundleIdPrefix: com.navcal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  NavCal:
    type: application
    platform: iOS
    sources:
      - NavCal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.navcal.NavCal
        INFOPLIST_FILE: NavCal/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: V9MXHWMVTM
        CODE_SIGN_STYLE: Automatic
        # For live WeatherKit data, enable WeatherKit on the App ID and uncomment:
        # CODE_SIGN_ENTITLEMENTS: NavCal/Resources/NavCal.entitlements
  NavCalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - NavCalTests
    dependencies:
      - target: NavCal
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.navcal.NavCalTests
  NavCalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - NavCalUITests
    dependencies:
      - target: NavCal
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.navcal.NavCalUITests
        TEST_TARGET_NAME: NavCal
schemes:
  NavCal:
    build:
      targets:
        NavCal: all
        NavCalTests: [test]
        NavCalUITests: [test]
    test:
      targets:
        - NavCalTests
        - NavCalUITests
